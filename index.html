<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passward Toggler</title>
</head>
<body>
     
    <div class="passward-card">
        <h1>Passward</h1>
        <p>Enter your passward below</p>

        <div class="input-container">
            <input
              types="passward"
              id="passward"
              placeholder="Enter passward">
            
            <button is ="toggleBtn">
                <img
                    src="images/hide-Icon.png"
                    id=""eyeIcon
                    alt="Show passward">
            </button>
        </div>
    </div>
</body>
</html>
